<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Тапатель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap');
        :root { --ink: #17232b; --paper: #f2eee3; --hot: #ed6a3a; --mint: #a9e5c7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .28; background-image: radial-gradient(#17232b 0.7px, transparent 0.7px); background-size: 18px 18px; }
        main { position: relative; z-index: 1; width: min(100%, 540px); min-height: 100vh; margin: auto; padding: 28px 22px 22px; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: start; }
        .eyebrow { margin: 0 0 5px; font: 500 11px 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(34px, 11vw, 58px); line-height: .9; letter-spacing: -.05em; }
        .badge { padding: 9px 11px; border: 2px solid var(--ink); border-radius: 100px; font: 500 12px 'DM Mono', monospace; background: var(--mint); }
        .score-block { margin: auto 0 25px; text-align: center; }
        .score { margin: 0; font-size: clamp(86px, 25vw, 140px); line-height: .9; letter-spacing: -.09em; }
        .score-label { margin: 12px 0 0; font: 500 12px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
        .tap { position: relative; width: min(72vw, 300px); aspect-ratio: 1; margin: 0 auto 28px; border: 3px solid var(--ink); border-radius: 50%; color: var(--paper); background: var(--hot); box-shadow: 9px 9px 0 var(--ink); cursor: pointer; font: 700 clamp(24px, 8vw, 42px) 'Space Grotesk', sans-serif; transition: transform .08s, box-shadow .08s; }
        .tap:active { transform: translate(7px, 7px) scale(.98); box-shadow: 2px 2px 0 var(--ink); }
        .tap::after { content: '+1'; position: absolute; top: 14%; right: 4%; padding: 5px 8px; border: 2px solid var(--ink); border-radius: 50%; color: var(--ink); background: var(--mint); font: 500 14px 'DM Mono', monospace; transform: rotate(12deg); }
        footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 12px 'DM Mono', monospace; }
        button.secondary { padding: 11px 13px; border: 2px solid var(--ink); border-radius: 7px; color: var(--ink); background: transparent; cursor: pointer; font: 500 12px 'DM Mono', monospace; }
        .pop { position: fixed; z-index: 2; pointer-events: none; color: var(--hot); font: 700 22px 'DM Mono', monospace; animation: rise .6s ease-out forwards; }
        @keyframes rise { to { opacity: 0; transform: translateY(-70px) rotate(-8deg); } }
    </style>
</head>
<body>
    <main>
        <header><div><p class="eyebrow">mini app / 001</p><h1>Тапатель</h1></div><div class="badge">онлайн</div></header>
        <section class="score-block"><p class="score" id="score">0</p><p class="score-label">твои нажатия</p></section>
        <button class="tap" id="tap" aria-label="Добавить одно очко">ЖМИ</button>
        <footer><span id="best">рекорд: 0</span><button class="secondary" id="reset">сбросить</button></footer>
    </main>
    <script>
        const telegram = window.Telegram?.WebApp;
        telegram?.ready();
        telegram?.expand();
        const scoreElement = document.querySelector('#score');
        const bestElement = document.querySelector('#best');
        const tapButton = document.querySelector('#tap');
        const resetButton = document.querySelector('#reset');
        let score = Number(localStorage.getItem('tap-score') || 0);
        let best = Number(localStorage.getItem('tap-best') || 0);

        function render() {
            scoreElement.textContent = score.toLocaleString('ru-RU');
            bestElement.textContent = `рекорд: ${best.toLocaleString('ru-RU')}`;
        }

        function save() {
            localStorage.setItem('tap-score', score);
            localStorage.setItem('tap-best', best);
            telegram?.CloudStorage?.setItem('score', String(score));
        }

        tapButton.addEventListener('click', (event) => {
            score += 1;
            best = Math.max(best, score);
            render();
            save();
            telegram?.HapticFeedback?.impactOccurred('light');
            const pop = document.createElement('span');
            pop.className = 'pop';
            pop.textContent = '+1';
            pop.style.left = `${event.clientX - 10}px`;
            pop.style.top = `${event.clientY - 10}px`;
            document.body.append(pop);
            setTimeout(() => pop.remove(), 600);
        });

        resetButton.addEventListener('click', () => {
            score = 0;
            render();
            save();
            telegram?.HapticFeedback?.notificationOccurred('warning');
        });

        telegram?.CloudStorage?.getItem('score', (error, value) => {
            if (!error && value) {
                score = Math.max(score, Number(value));
                best = Math.max(best, score);
                render();
            }
        });
        render();
    </script>
</body>
</html>
